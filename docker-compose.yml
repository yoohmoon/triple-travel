version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: triple
    ports:
      - "3307:3306"

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  app1:
    build: .
    ports:
      - "8081:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/triple
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: local-docker-only-secret-do-not-use-in-production!!
      SERVER_NAME: app1

  app2:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/triple
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: local-docker-only-secret-do-not-use-in-production!!
      SERVER_NAME: app2

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf